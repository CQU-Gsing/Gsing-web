<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="重庆大学 GSing 机器人战队官方网站">
  <title>{% block title %}GSing 机器人战队｜重庆大学{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css', v='20260920-awards-2') }}">
  {% block head %}{% endblock %}
</head>
<body {% block body_attributes %}{% endblock %}>
  {% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
  {% block body %}{% endblock %}
</body>
</html>
