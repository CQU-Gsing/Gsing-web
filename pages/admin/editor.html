{% extends 'base.html' %}{% block title %}{{ '编辑文章' if mode=='edit' else '发布文章' }}｜GSing{% endblock %}{% block body %}<main class="admin-shell"><header class="admin-top"><a href="{{ url_for('admin') }}">← 返回文章管理</a><span>{{ admin_name }}</span></header><section class="editor-card"><p class="eyebrow">GSING EDITORIAL</p><h1>{{ '编辑文章' if mode=='edit' else '发布一篇新文章' }}</h1><p>保存后文章会按照发布状态出现在官网动态区。</p><form method="post"><div class="form-grid"><label>文章标题<input name="title" value="{{ article.title or '' }}" minlength="2" required></label><label>文章栏目<input name="category" value="{{ article.category or '战队动态' }}" required></label></div><label>内容摘要<textarea name="summary" rows="3" minlength="10" required>{{ article.summary or '' }}</textarea></label><label>文章正文<textarea name="content" rows="14" minlength="20" required>{{ article.content or '' }}</textarea></label><label class="checkbox"><input type="checkbox" name="published" {% if mode=='new' or article.published %}checked{% endif %}> 立即发布</label><button class="submit">{{ '保存修改' if mode=='edit' else '发布文章' }}</button></form></section></main>{% endblock %}
